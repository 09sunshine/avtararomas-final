name: Supabase Keep-Alive & Cleanup

on:
  schedule:
    # Every 3 days at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-keepalive.yml'

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Required Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MISSING=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Secret: SUPABASE_URL"
            MISSING=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Secret: SUPABASE_ANON_KEY"
            MISSING=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing GitHub Secret: SUPABASE_SERVICE_ROLE_KEY"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Required secrets are missing in GitHub repository settings!"
            echo "Please navigate to: Repo Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "Add the following secrets:"
            echo "  - SUPABASE_URL"
            echo "  - SUPABASE_ANON_KEY"
            echo "  - SUPABASE_SERVICE_ROLE_KEY"
            echo "  - RENDER_BACKEND_URL (optional)"
            exit 1
          fi
          echo "✅ All required repository secrets are present."

      - name: Ping Supabase (Keep Alive)
        id: ping_supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🏓 Pinging Supabase to prevent cold sleep..."

          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n')"

          echo "Target Supabase endpoint: $URL"
          START_TIME=$(date +%s%3N)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/store_settings?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          END_TIME=$(date +%s%3N)
          DURATION=$((END_TIME - START_TIME))

          echo "Supabase responded with status: $RESPONSE in ${DURATION}ms"
          echo "SUPABASE_STATUS=$RESPONSE" >> $GITHUB_ENV
          echo "DURATION_MS=$DURATION" >> $GITHUB_ENV

          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Supabase ping failed with status $RESPONSE!"
            echo "KEEPALIVE_STATUS=failed" >> $GITHUB_ENV
            exit 1
          fi
          echo "KEEPALIVE_STATUS=success" >> $GITHUB_ENV
          echo "✅ Supabase is alive and active!"

      - name: Ping Render Backend (Bonus Keep-Alive)
        id: ping_render
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          RENDER_URL="$(printf '%s' "$RENDER_BACKEND_URL" | tr -d '\r\n')"
          if [ -n "$RENDER_URL" ]; then
            echo "🏓 Pinging Render backend at $RENDER_URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/health" || true)
            echo "Render responded with status: $STATUS"
            echo "RENDER_STATUS=$STATUS" >> $GITHUB_ENV
            echo "✅ Render ping completed!"
          else
            echo "RENDER_STATUS=skipped" >> $GITHUB_ENV
            echo "ℹ️ RENDER_BACKEND_URL secret not set. Skipping Render ping."
          fi

      - name: Cleanup Old Cancelled/Refunded Orders (90+ days)
        id: cleanup_orders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          SERVICE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"

          echo "🧹 Cleaning up old cancelled/refunded orders..."
          CUTOFF=$(date -d '90 days ago' -u +%Y-%m-%dT%H:%M:%SZ)

          OLD_ORDER_IDS=$(curl -s \
            "$URL/rest/v1/orders?select=id&status=in.(cancelled,refunded)&created_at=lt.$CUTOFF" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            | jq -r '.[].id' 2>/dev/null)

          COUNT=0
          if [ -n "$OLD_ORDER_IDS" ]; then
            for ORDER_ID in $OLD_ORDER_IDS; do
              curl -s -X DELETE \
                "$URL/rest/v1/order_items?order_id=eq.$ORDER_ID" \
                -H "apikey: $SERVICE_KEY" \
                -H "Authorization: Bearer $SERVICE_KEY" > /dev/null

              curl -s -X DELETE \
                "$URL/rest/v1/orders?id=eq.$ORDER_ID" \
                -H "apikey: $SERVICE_KEY" \
                -H "Authorization: Bearer $SERVICE_KEY" > /dev/null

              COUNT=$((COUNT + 1))
              echo "  Deleted order: $ORDER_ID"
            done
            echo "✅ Cleaned up $COUNT old cancelled/refunded orders!"
          else
            echo "No old cancelled/refunded orders to clean up."
          fi
          echo "CLEANED_ORDERS=$COUNT" >> $GITHUB_ENV

      - name: Cleanup Expired Inactive Coupons (60+ days)
        id: cleanup_coupons
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          SERVICE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"

          echo "🧹 Cleaning up expired inactive coupons..."
          CUTOFF=$(date -d '60 days ago' -u +%Y-%m-%dT%H:%M:%SZ)

          RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$URL/rest/v1/coupons?active=eq.false&created_at=lt.$CUTOFF" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY")

          echo "Delete request returned HTTP $RESULT"
          echo "CLEANED_COUPONS_STATUS=$RESULT" >> $GITHUB_ENV
          echo "✅ Expired inactive coupons cleanup check completed!"

      - name: Save Keep-Alive Run to Database
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          echo "💾 Recording keep-alive execution into database..."

          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          SERVICE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n')"
          RENDER_URL="$(printf '%s' "$RENDER_BACKEND_URL" | tr -d '\r\n')"

          if [ -z "$URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "⚠️ Cannot log keep-alive to database: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set."
            exit 0
          fi

          KEEPALIVE_STATUS="${KEEPALIVE_STATUS:-success}"
          SUPABASE_STATUS="${SUPABASE_STATUS:-200}"
          DURATION_MS="${DURATION_MS:-0}"
          RENDER_STATUS="${RENDER_STATUS:-not_configured}"
          CLEANED_ORDERS="${CLEANED_ORDERS:-0}"
          CLEANED_COUPONS_STATUS="${CLEANED_COUPONS_STATUS:-200}"
          TRIGGER_EVENT="${{ github.event_name }}"
          RUN_ID="${{ github.run_id }}"
          ACTOR="${{ github.actor }}"

          PAYLOAD=$(jq -n \
            --arg status "$KEEPALIVE_STATUS" \
            --argjson response_status "${SUPABASE_STATUS:-200}" \
            --argjson duration_ms "${DURATION_MS:-0}" \
            --arg triggered_by "$TRIGGER_EVENT" \
            --arg message "Supabase keep-alive finished with status ${SUPABASE_STATUS}. Orders cleaned: ${CLEANED_ORDERS}." \
            --arg run_id "$RUN_ID" \
            --arg actor "$ACTOR" \
            --arg render_status "$RENDER_STATUS" \
            --arg coupons_status "$CLEANED_COUPONS_STATUS" \
            --argjson orders_cleaned "${CLEANED_ORDERS:-0}" \
            '{
              status: $status,
              response_status: $response_status,
              duration_ms: $duration_ms,
              triggered_by: $triggered_by,
              message: $message,
              details: {
                github_run_id: $run_id,
                github_actor: $actor,
                render_status: $render_status,
                coupons_cleaned_status: $coupons_status,
                orders_cleaned: $orders_cleaned
              }
            }')

          echo "Posting keep-alive log payload:"
          echo "$PAYLOAD"

          # 1. Direct insert to Supabase REST endpoint
          INSERT_RES=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "$URL/rest/v1/keep_alive_logs" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD")

          echo "Supabase insert result: $INSERT_RES"

          # 2. Also notify Render backend if configured
          if [ -n "$RENDER_URL" ]; then
            echo "Notifying Render backend at $RENDER_URL/api/admin/keep-alive/record..."
            curl -s -X POST "$RENDER_URL/api/admin/keep-alive/record" \
              -H "Content-Type: application/json" \
              -H "x-keepalive-key: $SERVICE_KEY" \
              -d "$PAYLOAD" || true
          fi

          echo "✅ Keep-alive execution saved to database successfully!"

      - name: Summary
        run: |
          echo "========================================="
          echo "🎉 All tasks completed successfully!"
          echo "  • Supabase pinged (keep-alive)"
          echo "  • Execution saved to database"
          echo "  • Next scheduled run: in ~3 days"
          echo "========================================="
